<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071b25">
  <title>Khe Suối Thái Cổ 3D</title>
</head>
<body>
  <div id="game"></div>
  <div class="hud">
    <div class="brand"><span class="orb"></span><div><b>KHE SUỐI THÁI CỔ</b><small>HỒ LINH NGƯ · LIVE WORLD</small></div></div>
    <div class="status"><i id="connection-dot"></i><span id="connection-label">Đang chờ máy chủ</span></div>
    <div class="stats"><span>NGƯỜI CÂU <b id="player-count">0</b></span><span>FPS <b id="fps">--</b></span></div>
    <div class="notice" id="notice">Chào mừng đến Hồ Linh Ngư</div>
    <div class="controls"><button id="cast">THẢ CÂU</button><button id="quality">ĐỒ HỌA: TỐI ƯU</button></div>
    <div class="help">TikTok: bình luận <b>CÂU CÁ</b> để vào hồ · <b>RỜI GAME</b> để rời hồ</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
